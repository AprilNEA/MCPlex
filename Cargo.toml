[package]
name = "mcplex"
version = "0.4.0"
edition = "2024"
description = "A local gateway for dedicated MCP server endpoints"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AprilNEA/MCPlex"
homepage = "https://github.com/AprilNEA/MCPlex"
rust-version = "1.88"

[workspace]
exclude = ["vendor/rmcp"]
resolver = "2"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
config-rs = { package = "config", version = "0.15.25", default-features = false, features = ["toml"] }
crossterm = "=0.29.0"
directories = "6.0"
rmcp = { package = "mcplex-rmcp", version = "=3.1.2-mcplex.2", path = "vendor/rmcp", features = ["auth", "client", "elicitation", "transport-child-process", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
http = "1"
keyring = { version = "3", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust", "apple-native", "vendored"] }
fs2 = "0.4"
hex = "0.4"
notify = "8"
rand = "0.9"
ratatui = "=0.30.2"
rpassword = "7.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
tokio = { version = "1.47", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = { version = "0.5", features = ["util"] }
url = "2"
webbrowser = "1"

[profile.release]
lto = "thin"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.30.0"
# CI backends to support
ci = "github"
# release.yml adds a guarded workflow-dispatch recovery path around generated jobs.
allow-dirty = ["ci"]
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Post-announce jobs to run in CI
post-announce-jobs = ["./homebrew"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false

# GitHub retired the macos-13 hosted runner used by cargo-dist's defaults.
[workspace.metadata.dist.github-custom-runners]
aarch64-apple-darwin = "macos-14"
x86_64-apple-darwin = "macos-14"
