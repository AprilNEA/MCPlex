[package]
name = "mcplex-rmcp"
version = "3.1.2-mcplex.2"
edition = "2024"
rust-version = "1.88"
resolver = "2"
description = "MCPlex transport compatibility fork of the official Rust MCP SDK"
homepage = "https://github.com/AprilNEA/MCPlex"
documentation = "https://docs.rs/mcplex-rmcp"
repository = "https://github.com/AprilNEA/MCPlex"
readme = "README.md"
license = "Apache-2.0"
build = "build.rs"

[package.metadata.docs.rs]
features = [
    "auth",
    "auth-client-credentials-jwt",
    "base64",
    "client",
    "client-side-sse",
    "elicitation",
    "macros",
    "request-state",
    "reqwest",
    "reqwest-native-tls",
    "reqwest-tls-no-provider",
    "schemars",
    "server",
    "server-side-http",
    "tower",
    "transport-async-rw",
    "transport-child-process",
    "transport-io",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-client-unix-socket",
    "transport-streamable-http-server",
    "transport-streamable-http-server-session",
    "transport-worker",
    "uuid",
]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "rmcp"
path = "src/lib.rs"

[features]
default = ["base64", "macros", "server"]
local = ["rmcp-macros?/local"]
client = ["dep:tokio-stream"]
server = ["transport-async-rw", "schemars", "dep:pastey", "uuid"]
macros = ["dep:rmcp-macros", "dep:pastey"]
elicitation = ["dep:url"]
request-state = ["dep:hmac", "dep:sha2", "base64"]
__reqwest = ["dep:reqwest"]
reqwest = ["__reqwest", "reqwest?/rustls"]
reqwest-tls-no-provider = ["__reqwest", "reqwest?/rustls-no-provider"]
reqwest-native-tls = ["__reqwest", "reqwest?/native-tls"]
server-side-http = [
    "uuid",
    "dep:rand",
    "dep:tokio-stream",
    "dep:http",
    "dep:http-body",
    "dep:http-body-util",
    "dep:bytes",
    "dep:sse-stream",
    "tower",
    "base64",
]
transport-worker = ["dep:tokio-stream"]
client-side-sse = ["dep:sse-stream", "dep:http", "dep:bytes", "base64"]
transport-streamable-http-client = ["client-side-sse", "transport-worker"]
transport-streamable-http-client-reqwest = ["transport-streamable-http-client", "__reqwest"]
transport-streamable-http-client-unix-socket = [
    "transport-streamable-http-client",
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:http",
    "dep:bytes",
    "tokio/net",
]
transport-async-rw = ["tokio/io-util", "tokio-util/codec"]
transport-io = ["transport-async-rw", "tokio/io-std"]
transport-child-process = ["transport-async-rw", "tokio/process", "dep:process-wrap"]
which-command = ["transport-child-process", "dep:which"]
transport-streamable-http-server = [
    "transport-streamable-http-server-session",
    "server-side-http",
    "transport-worker",
]
transport-streamable-http-server-session = [
    "transport-async-rw",
    "dep:async-trait",
    "dep:tokio-stream",
]
tower = ["dep:tower-service"]
auth = ["dep:async-trait", "dep:oauth2", "__reqwest", "dep:url"]
auth-client-credentials-jwt = ["auth", "dep:jsonwebtoken", "uuid"]
schemars = ["dep:schemars"]

[dependencies]
async-trait = { version = "0.1.89", optional = true }
base64 = { version = "0.23", optional = true }
bytes = { version = "1", optional = true }
futures = "0.3"
hmac = { version = "0.13", optional = true }
http = { version = "1", optional = true }
http-body = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
jsonwebtoken = { version = "11", features = ["aws_lc_rs"], optional = true }
oauth2 = { version = "5.0", optional = true, default-features = false }
pastey = { version = "0.2.0", optional = true }
pin-project-lite = "0.2"
process-wrap = { version = "9.0", features = ["tokio1"], optional = true }
rand = { version = "0.10", optional = true }
reqwest = { version = "0.13.2", features = ["json", "stream"], optional = true, default-features = false }
rmcp-macros = { version = "3.1.2", optional = true }
schemars = { version = "1.0", features = ["chrono04"], optional = true }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = { version = "0.11", optional = true }
sse-stream = { version = "0.2.4", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["sync", "macros", "rt", "time"] }
tokio-stream = { version = "0.1", optional = true }
tokio-util = "0.7"
tower-service = { version = "0.3", optional = true }
tracing = "0.1"
url = { version = "2.4", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
which = { version = "8", optional = true }

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
chrono = { version = "0.4.38", default-features = false, features = ["serde", "now"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
chrono = { version = "0.4.38", default-features = false, features = ["serde", "clock", "std", "oldtime"] }

[lints.clippy]
exhaustive_structs = "warn"
exhaustive_enums = "warn"
