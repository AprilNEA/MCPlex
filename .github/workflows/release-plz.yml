name: Release PR

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional existing release-PR tag to publish or recover (for example v0.4.0).
        required: false
        type: string
  push:
    branches: [master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  release-pr:
    name: release-plz PR
    if: ${{ github.event_name == 'push' || inputs.release_tag == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: false
      # An App token is required: tags created with GITHUB_TOKEN do not trigger
      # the cargo-dist release workflow.
      - name: Mint GitHub App token
        id: app-token
        uses: ./.github/actions/github-app-token-from-1password
        with:
          op-service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          op-github-app-item: ${{ secrets.OP_GITHUB_APP_ITEM }}
      - name: Open or update release PR
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5
        with:
          command: release-pr
          version: "0.3.160"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  release:
    name: publish crate and create tag
    if: >-
      (github.event_name == 'push' && contains(github.event.head_commit.message, 'chore: release v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: release-plz-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      # Pin publication to the release-PR merge event SHA. A retry of this run
      # preserves the same SHA; a later master workflow cannot publish it.
      - name: Validate release commit
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${REQUESTED_TAG}"
            if [[ ! "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::Invalid recovery tag: ${tag}"
              exit 1
            fi
            version="${tag#v}"
            release_sha="$(git log -1 --format=%H --fixed-strings --grep="chore: release ${tag}" origin/master || true)"
            if [[ -z "${release_sha}" ]]; then
              echo "::error::Could not find a merged release commit for ${tag}"
              exit 1
            fi
          else
            version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "mcplex") | .version')"
            tag="v${version}"
            release_sha="${GITHUB_SHA}"
          fi
          if ! git merge-base --is-ancestor "${release_sha}" origin/master; then
            echo "::error::Release commit ${release_sha} is not on origin/master"
            exit 1
          fi
          message="$(git show -s --format=%B "${release_sha}")"
          normalized_message="$(sed -E 's/ \(#[0-9]+\)$//' <<< "${message}")"
          if ! grep -Fxq "chore: release ${tag}" <<< "${normalized_message}"; then
            echo "::error::${release_sha} does not contain an exact release line for ${tag}"
            exit 1
          fi
          git fetch --force origin 'refs/tags/*:refs/tags/*'
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            tag_sha="$(git rev-list -n1 "${tag}")"
            if [[ "${tag_sha}" != "${release_sha}" ]]; then
              echo "::error::Existing ${tag} points to ${tag_sha}, not release commit ${release_sha}"
              exit 1
            fi
            echo "Tag ${tag} already exists at the release commit; nothing to publish."
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          actual_version="$(git show "${release_sha}:Cargo.toml" | sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' | head -n1)"
          if [[ "${actual_version}" != "${version}" ]]; then
            echo "::error::Release commit contains ${actual_version}, expected ${version}"
            exit 1
          fi
          git switch --force -C master "${release_sha}"
          git branch --set-upstream-to=origin/master master
          echo "skip=false" >> "$GITHUB_ENV"
          echo "release_tag=${tag}" >> "$GITHUB_ENV"
          echo "release_sha=${release_sha}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
        if: env.skip != 'true'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: env.skip != 'true'
        with:
          save-if: false
      - name: Mint GitHub App token
        if: env.skip != 'true'
        id: app-token
        uses: ./.github/actions/github-app-token-from-1password
        with:
          op-service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          op-github-app-item: ${{ secrets.OP_GITHUB_APP_ITEM }}
      - name: Select release mode
        if: env.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="${release_tag#v}"
          if cargo info "mcplex@${version}" --registry crates-io >/dev/null 2>&1; then
            sed -i '/^\[\[package\]\]/,$ s/^publish = true$/publish = false/' release-plz.toml
            grep -Fxq 'publish = false' release-plz.toml
            echo "mcplex ${version} is already published; creating only the missing Git tag."
          fi
      - name: Publish crate and create tag
        if: env.skip != 'true'
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5
        with:
          command: release
          version: "0.3.160"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.app-token.outputs.cargo-registry-token }}
      - name: Verify release tag
        if: env.skip != 'true'
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${release_tag}:refs/tags/${release_tag}"
          tag_sha="$(git rev-list -n1 "${release_tag}")"
          if [[ "${tag_sha}" != "${release_sha}" ]]; then
            echo "::error::${release_tag} points to ${tag_sha}, expected ${release_sha}"
            exit 1
          fi
